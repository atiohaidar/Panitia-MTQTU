<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 680" width="100%" height="100%" style="background-color: #faf8f5; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Canvas Background -->
  <rect width="500" height="680" fill="#faf8f5" />
  
  <!-- OPTION 3 LABEL -->
  <g transform="translate(30, 35)">
    <rect width="210" height="26" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="12" y="17" font-size="11" font-weight="700" fill="#15803d" letter-spacing="0.5">OPSI 3: MOBILE-FIRST FULL VIEW</text>
  </g>

  <!-- MOBILE DEVICE FRAME PREVIEW (360x560 inside) -->
  <g transform="translate(70, 75)">
    <!-- Device Shadow & Frame -->
    <rect width="360" height="570" rx="36" fill="#ffffff" stroke="#d6d3d1" stroke-width="2" filter="drop-shadow(0 15px 30px rgba(28,25,23,0.08))" />
    
    <!-- Mobile Screen Canvas inside -->
    <rect x="4" y="4" width="352" height="562" rx="32" fill="#faf8f5" />

    <!-- Speaker Bar / Notch -->
    <rect x="135" y="14" width="90" height="5" rx="2.5" fill="#e7e5e4" />

    <!-- CONTENT INSIDE MOBILE SCREEN -->
    <!-- Top Brand -->
    <g transform="translate(180, 75)" text-anchor="middle">
      <rect x="-16" y="-16" width="32" height="32" rx="8" fill="#c9242b" />
      <text x="0" y="6" font-size="16" font-weight="900" fill="#ffffff">M</text>
      <text x="0" y="38" font-size="18" font-weight="800" fill="#1c1917" letter-spacing="-0.3">MTQ Tel-U 2026</text>
      <text x="0" y="54" font-size="11" font-weight="500" fill="#78716c">Portal Panitia</text>
    </g>

    <!-- THE CARD INSIDE MOBILE (Padding fits screen perfectly) -->
    <g transform="translate(24, 175)">
      <!-- Card Box -->
      <rect x="0" y="14" width="304" height="315" rx="20" fill="#ffffff" stroke="#e7e2da" stroke-width="1.2" filter="drop-shadow(0 4px 12px rgba(28,25,23,0.03))" />
      
      <!-- Attached Tab Pill (Centered on card top) -->
      <g transform="translate(152, 14)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#c9242b" filter="drop-shadow(0 2px 5px rgba(201,36,43,0.3))" />
        <text x="0" y="4" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">PANITIA MASUK</text>
      </g>

      <!-- Inside Form -->
      <g transform="translate(20, 36)">
        <text x="0" y="16" font-size="15" font-weight="700" fill="#1c1917">Login Akun</text>

        <!-- Input 1 -->
        <g transform="translate(0, 32)">
          <text x="0" y="10" font-size="10" font-weight="700" fill="#57534e">EMAIL / NIM</text>
          <rect x="0" y="16" width="264" height="42" rx="10" fill="#faf8f5" stroke="#e7e2da" stroke-width="1" />
          <text x="12" y="41" font-size="12" fill="#a8a29e">nama@telkomuniversity.ac.id</text>
        </g>

        <!-- Input 2 -->
        <g transform="translate(0, 104)">
          <text x="0" y="10" font-size="10" font-weight="700" fill="#57534e">KATA SANDI</text>
          <rect x="0" y="16" width="264" height="42" rx="10" fill="#faf8f5" stroke="#e7e2da" stroke-width="1" />
          <text x="12" y="41" font-size="14" fill="#1c1917">••••••••••</text>
          <circle cx="248" cy="37" r="4" fill="none" stroke="#a8a29e" stroke-width="1.5" />
        </g>

        <!-- Options -->
        <g transform="translate(0, 180)">
          <rect x="0" y="0" width="14" height="14" rx="3" fill="#c9242b" />
          <path d="M3 7 L6 10 L11 4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
          <text x="20" y="11" font-size="11" font-weight="500" fill="#57534e">Ingat saya</text>
          <text x="264" y="11" font-size="11" font-weight="600" fill="#c9242b" text-anchor="end">Lupa sandi?</text>
        </g>

        <!-- Action Button -->
        <g transform="translate(0, 214)">
          <rect x="0" y="0" width="264" height="44" rx="12" fill="#c9242b" filter="drop-shadow(0 3px 8px rgba(201,36,43,0.25))" />
          <text x="132" y="27" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Masuk</text>
        </g>
      </g>
    </g>

    <!-- Mobile Home Indicator Bar -->
    <rect x="120" y="546" width="120" height="4" rx="2" fill="#a8a29e" />
  </g>
</svg>
