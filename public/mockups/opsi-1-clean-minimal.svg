<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 680" width="100%" height="100%" style="background-color: #faf8f5; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Canvas Background -->
  <rect width="500" height="680" fill="#faf8f5" />
  
  <!-- Subtle Warm Amber/Red Ambient Floor Glow -->
  <ellipse cx="250" cy="650" rx="200" ry="80" fill="#e05315" opacity="0.08" />

  <!-- OPTION 1 LABEL -->
  <g transform="translate(30, 35)">
    <rect width="180" height="26" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
    <text x="12" y="17" font-size="11" font-weight="700" fill="#c9242b" letter-spacing="0.5">OPSI 1: ULTRA-MINIMAL</text>
  </g>

  <!-- TOP BRANDING HEADER -->
  <g transform="translate(250, 110)" text-anchor="middle">
    <!-- Emblem -->
    <rect x="-20" y="-35" width="40" height="40" rx="10" fill="#c9242b" />
    <text x="0" y="-10" font-size="20" font-weight="900" fill="#ffffff">M</text>
    
    <!-- Title -->
    <text x="0" y="24" font-size="22" font-weight="800" fill="#1c1917" letter-spacing="-0.5">MTQ Tel-U 2026</text>
    <text x="0" y="44" font-size="12" font-weight="500" fill="#78716c">Portal Kepanitiaan Resmi</text>
  </g>

  <!-- THE CARD (With Attached Tab on Top) -->
  <g transform="translate(60, 200)">
    <!-- White Card Base -->
    <rect x="0" y="16" width="380" height="380" rx="24" fill="#ffffff" stroke="#e7e2da" stroke-width="1.5" filter="drop-shadow(0 10px 25px rgba(28,25,23,0.05))" />
    
    <!-- THE SIGNATURE ATTACHED TAB PILL (Centered) -->
    <g transform="translate(190, 16)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#c9242b" filter="drop-shadow(0 3px 6px rgba(201,36,43,0.3))" />
      <text x="0" y="4" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">PANITIA MASUK</text>
    </g>

    <!-- FORM ELEMENTS -->
    <g transform="translate(32, 55)">
      <!-- Card Title -->
      <text x="0" y="20" font-size="17" font-weight="700" fill="#1c1917">Masuk ke Sistem</text>
      <text x="0" y="38" font-size="12" font-weight="400" fill="#78716c">Masukkan akun SSO atau email panitia.</text>

      <!-- Field 1: Email -->
      <g transform="translate(0, 58)">
        <text x="0" y="10" font-size="11" font-weight="600" fill="#44403c">EMAIL / AKUN PANITIA</text>
        <rect x="0" y="18" width="316" height="46" rx="12" fill="#fdfcfb" stroke="#e7e2da" stroke-width="1.2" />
        <text x="16" y="46" font-size="13" fill="#a8a29e">nama@telkomuniversity.ac.id</text>
      </g>

      <!-- Field 2: Password -->
      <g transform="translate(0, 142)">
        <text x="0" y="10" font-size="11" font-weight="600" fill="#44403c">KATA SANDI</text>
        <text x="316" y="10" font-size="11" font-weight="600" fill="#c9242b" text-anchor="end">Lupa sandi?</text>
        <rect x="0" y="18" width="316" height="46" rx="12" fill="#fdfcfb" stroke="#e7e2da" stroke-width="1.2" />
        <text x="16" y="46" font-size="15" fill="#1c1917">••••••••••••</text>
        <!-- Eye Icon Placeholder -->
        <circle cx="295" cy="41" r="5" fill="none" stroke="#a8a29e" stroke-width="1.5" />
      </g>

      <!-- Row: Remember Me Checkbox -->
      <g transform="translate(0, 226)">
        <rect x="0" y="0" width="16" height="16" rx="4" fill="#c9242b" />
        <!-- Checkmark -->
        <path d="M4 8 L7 11 L12 5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="26" y="13" font-size="12" font-weight="500" fill="#57534e">Ingat saya di perangkat ini</text>
      </g>

      <!-- Primary Action Button (Red MTQTU) -->
      <g transform="translate(0, 258)">
        <rect x="0" y="0" width="316" height="48" rx="14" fill="#c9242b" filter="drop-shadow(0 4px 10px rgba(201,36,43,0.25))" />
        <text x="158" y="29" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.2">Masuk ke Dashboard</text>
      </g>
    </g>
  </g>

  <!-- FOOTER -->
  <g transform="translate(250, 625)" text-anchor="middle">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#78716c">MTQ Telkom University 2026 • Road to MTQMN 2027</text>
    <text x="0" y="16" font-size="10" fill="#a8a29e">Direktorat Kemahasiswaan Karier dan Alumni (KKA)</text>
  </g>
</svg>
